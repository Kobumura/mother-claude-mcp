# Reverse proxy in front of the loopback-bound service, so TLS terminates at nginx
# and the Node process is never directly reachable.
#
# Streamable HTTP can hold a response open for streaming, so buffering must be off
# and the read timeout generous, or long tool calls get cut mid-flight.
location /mcp {
    proxy_pass         http://127.0.0.1:8848/mcp;
    proxy_http_version 1.1;

    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Connection        "";

    proxy_buffering    off;
    proxy_cache        off;
    proxy_read_timeout 300s;
}

location = /healthz {
    proxy_pass       http://127.0.0.1:8848/healthz;
    proxy_set_header Host $host;
}
